# Arma el instalador de draw101 en un Linux de GitHub (con wine), lo manda a
# `descargas` por la rama de carga que espera `publicar-instalador.yml`, espera
# a que esa release exista, deja `draw101.json` y el README de `descargas`
# diciendo la versión nueva, y al final borra las releases viejas de draw101.
# Al terminar, la 0.20.x instalada en cualquier máquina ve el letrero
# «Actualizar».
#
# POR QUÉ
#
# El chat de draw101 (claude.ai) es el responsable de publicar el producto, pero
# su conector de GitHub sólo escribe texto: no puede subir un .exe de 120 MB ni
# crear releases. Lo que sí puede es empujar este archivo y un tag. Con eso,
# aquí se arma y se publica todo; el binario nunca pasa por el chat.
#
# CÓMO SE DISPARA
#
#   · creando una rama `claude/publicar-<version>` (p. ej. `claude/publicar-0.20.3`)
#     desde la rama que tenga el código: es lo que el conector del chat sí sabe
#     hacer (create_branch dispara el evento push), o
#   · empujando un tag `v<version>`, o
#   · a mano (workflow_dispatch) eligiendo la rama.
#   El nombre debe coincidir con core/version.py o el flujo se niega.
#
# QUÉ NECESITA (una sola vez, lo pone Mike)
#
#   Secreto del repositorio `TOKEN_DESCARGAS`: token fine-grained con acceso
#   SÓLO al repositorio `descargas`, permiso Contents: Read and write. Sin él,
#   el flujo arma igual y se detiene antes de cargar (lo dice en el resumen).
#
# PARCHES PENDIENTES
#
#   Si existe `claude/APLICAR.txt`, cada renglón es un parche de `claude/` que
#   se aplica sobre el árbol antes de armar (el chat deja el cambio así cuando
#   los archivos son grandes para reescribirlos por el conector). Cuando Jr.
#   mezcla el parche en el código, borra el renglón y el flujo no aplica nada.
#
# POR QUÉ EN LINUX Y NO EN WINDOWS  ·  16-sep-2026
#
#   Mike: «se consumieron muy rápido los deploys». draw101 es privado, así que
#   sus minutos se cobran, y GitHub cobra los de Windows AL DOBLE: 40 minutos de
#   run eran ~80 de cuota, por versión. Armar con wine en Linux tarda ~10 y
#   cuenta ×1: ocho veces más barato. El instalador sale igual —así se armaron
#   las 0.20.2, 0.20.3, 0.20.4 y 0.20.16, que Mike instaló sin problema—, porque
#   quien arma el NSIS es electron-builder, no Windows.
#
#   También se fueron dos cosas que costaban y no aportaban: las pruebas (ya se
#   corren enteras en el chat antes de disparar; aquí se llevaban la mitad del
#   run) y el artefacto de 125 MB (el instalador termina en `descargas`, que es
#   de donde se baja). La comprobación que importa —bajar lo publicado y
#   comparar su sha256— sigue igual.

name: Armar y publicar

on:
  push:
    tags: ['v*']
    branches: ['claude/publicar-*']
  workflow_dispatch:
    inputs:
      con_pruebas:
        description: 'Correr python verificar.py aquí (normalmente no: ya se corren en el chat)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: armar-y-publicar
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  # wine sin ventana ni quejas: el runner no tiene pantalla.
  WINEDEBUG: '-all'
  WINEDLLOVERRIDES: 'mscoree,mshtml='
  INSTALADOR_ANTERIOR: https://github.com/mikebalcazar/descargas/releases/download/draw101-0.20.1/draw101-0.20.1-setup.exe
  # Cuántas versiones de draw101 se guardan en `descargas`. Mike, 16-sep-2026:
  # «quedémonos sólo con las 3 últimas». `draw101-ultima` no cuenta y nunca se
  # borra: es la liga fija que usa el actualizador.
  GUARDAR_VERSIONES: '3'

jobs:
  armar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar parches pendientes (claude/APLICAR.txt)
        run: |
          set -euo pipefail
          if [ -f claude/APLICAR.txt ]; then
            # Se sigue quitando el \r por si el archivo se escribió en Windows.
            while read -r p; do
              p="${p%$'\r'}"
              [ -z "$p" ] && continue
              echo "aplicando claude/$p"
              sed -i 's/\r$//' "claude/$p"
              git apply --check "claude/$p"
              git apply "claude/$p"
            done < claude/APLICAR.txt
          else
            echo "sin parches pendientes"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Versión y tag deben coincidir
        id: version
        run: |
          set -euo pipefail
          VER=$(python -c "import core.version as v; print(v.VERSION)")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "core/version.py dice $VER"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            [ "$TAG" = "$VER" ] || { echo "el tag v$TAG no coincide con core/version.py ($VER)"; exit 1; }
          elif [[ "$GITHUB_REF" == refs/heads/claude/publicar-* ]]; then
            PED="${GITHUB_REF#refs/heads/claude/publicar-}"
            [ "$PED" = "$VER" ] || { echo "la rama pide $PED pero core/version.py dice $VER"; exit 1; }
          fi
          grep -q "\"version\": \"$VER\"" package.json || { echo "package.json no dice $VER"; exit 1; }
          grep -q "draw101-$VER-setup" package.json || { echo "artifactName de package.json no dice $VER"; exit 1; }
          case "$VER" in X.*) echo "la línea X no se publica"; exit 1;; esac

      - name: wine y 7z (para armar el .exe desde Linux)
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends p7zip-full wine wine32:i386
          wine --version

      - name: Python empotrado (del último instalador publicado)
        run: |
          set -euo pipefail
          curl -sSL -o anterior.exe "$INSTALADOR_ANTERIOR"
          7z x -y -oanterior anterior.exe "resources/python/*" > /dev/null
          mkdir -p runtime && mv anterior/resources/python runtime/python
          # En Linux no se puede correr python.exe; se comprueba que estén los
          # paquetes que el motor necesita.
          test -f runtime/python/python.exe
          for m in ezdxf fastapi uvicorn numpy PIL reportlab; do
            ls -d runtime/python/Lib/site-packages/$m* > /dev/null || { echo "falta $m en el Python empotrado"; exit 1; }
          done
          echo "python empotrado ok"
          rm -rf anterior anterior.exe

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Dependencias de Electron
        run: npm ci --no-audit --no-fund

      - name: Motores DWG presentes
        run: |
          test -f dwgjs/node_modules/@mlightcad/libredwg-web/wasm/libredwg-web.wasm
          test -d dwgjs/node_modules/@node-projects/acad-ts/dist
          echo "motores DWG ok"

      # Normalmente NO se corren aquí: las pruebas ya pasaron enteras en el chat
      # antes de disparar, y repetirlas era la mitad del costo del run.
      - name: Pruebas (python verificar.py)
        if: ${{ inputs.con_pruebas }}
        run: |
          set -euo pipefail
          pip install -q ezdxf fastapi uvicorn numpy pillow reportlab pymupdf pypdfium2 playwright
          python -m playwright install chromium
          python verificar.py

      - name: Armar el instalador
        run: npx electron-builder --win nsis

      - name: Preparar la carga y el manifiesto
        id: carga
        run: |
          set -euo pipefail
          VER=${{ steps.version.outputs.version }}
          python build/cargar.py "dist/draw101-$VER-setup.exe" salida
          SHA=$(python -c "import json;print(json.load(open('salida/carga/meta.json'))['sha256'])")
          B=$(python -c "import json;print(json.load(open('salida/carga/meta.json'))['bytes'])")
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "bytes=$B" >> "$GITHUB_OUTPUT"
          {
            echo "## draw101 $VER armada"
            echo
            echo "- \`draw101-$VER-setup.exe\` · $B bytes · sha256 \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # El instalador NO se guarda como artefacto: eran 125 MB por run y termina
      # en `descargas`, que es de donde se baja. Si la carga falla, se vuelve a
      # armar: cuesta diez minutos.

      - name: Cargar a descargas (rama claude/carga-…)
        id: cargar
        env:
          TOKEN: ${{ secrets.TOKEN_DESCARGAS }}
        run: |
          set -euo pipefail
          VER=${{ steps.version.outputs.version }}
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::Falta el secreto TOKEN_DESCARGAS: el instalador se armó pero no se pudo cargar a descargas."
            echo "- **No se cargó a descargas**: falta el secreto \`TOKEN_DESCARGAS\` (Settings → Secrets and variables → Actions)." >> "$GITHUB_STEP_SUMMARY"
            echo "cargado=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/mikebalcazar/descargas" descargas
          cd descargas
          git config user.name "draw101 (Armar y publicar)"
          git config user.email "mike@forespot.com"
          RAMA="claude/carga-draw101-$VER"
          # Desde main, no huérfana: una rama huérfana NO dispara
          # publicar-instalador.yml (medido por Jr. el 13-sep con shape101).
          git checkout -q -b "$RAMA"
          rm -rf carga && cp -r ../salida/carga carga
          git add carga
          git commit -qm "carga: draw101 $VER (armada por Actions de draw101)"
          git push -q origin "$RAMA"
          echo "rama $RAMA empujada; publicar-instalador.yml arranca solo en descargas"
          echo "cargado=si" >> "$GITHUB_OUTPUT"

      - name: Esperar la release y dejar el manifiesto en main
        if: steps.cargar.outputs.cargado == 'si'
        env:
          TOKEN: ${{ secrets.TOKEN_DESCARGAS }}
        run: |
          set -euo pipefail
          VER=${{ steps.version.outputs.version }}
          SHA=${{ steps.carga.outputs.sha256 }}
          B=${{ steps.carga.outputs.bytes }}
          URL="https://github.com/mikebalcazar/descargas/releases/download/draw101-$VER/draw101-$VER-setup.exe"
          ok=0
          for i in $(seq 1 40); do          # hasta ~20 min
            code=$(curl -s -L --max-time 300 -o bajado.exe -w '%{http_code}' "$URL" || true)
            if [ "$code" = "200" ]; then
              sha=$(sha256sum bajado.exe | cut -d' ' -f1); b=$(stat -c '%s' bajado.exe)
              if [ "$sha" = "$SHA" ] && [ "$b" = "$B" ]; then ok=1; break; fi
              echo "publicado pero no cuadra todavía ($sha / $b), reintento $i"
            else
              echo "release aún no existe ($code), reintento $i"
            fi
            rm -f bajado.exe
            sleep 30
          done
          [ $ok = 1 ] || { echo "la release draw101-$VER no apareció con la huella esperada: no se toca el manifiesto"; exit 1; }
          echo "release draw101-$VER publicada y comprobada: $B bytes · sha256 cuadra ✓"

          cd descargas
          git checkout -q main && git pull -q
          cp ../salida/draw101.json draw101.json
          python - <<'EOF'
          import re, pathlib
          renglon = pathlib.Path("../salida/readme-renglon.md").read_text(encoding="utf-8").strip()
          p = pathlib.Path("README.md"); s = p.read_text(encoding="utf-8")
          nuevo, n = re.subn(r"^\| \*\*draw101\*\* \|.*$", renglon, s, count=1, flags=re.M)
          if n != 1: raise SystemExit("no encontré el renglón de draw101 en README.md")
          p.write_text(nuevo, encoding="utf-8")
          EOF
          git add draw101.json README.md
          git commit -qm "draw101 $VER: manifiesto y README (armada y publicada por Actions de draw101)"
          git push -q origin main
          echo "- Release \`draw101-$VER\` publicada · \`draw101-ultima\` movida · \`draw101.json\` y README en main." >> "$GITHUB_STEP_SUMMARY"
          echo "- Las 0.20.x instaladas ya ven el letrero «Actualizar»." >> "$GITHUB_STEP_SUMMARY"

      # Guardar catorce versiones de un instalador de 125 MB no le sirve a
      # nadie: el actualizador sólo mira `draw101.json` y la etiqueta
      # `draw101-ultima`. Mike, 16-sep-2026: «quedémonos sólo con las 3
      # últimas». Se borra la release y su etiqueta; `draw101-ultima` nunca.
      # Si algo falla aquí, no se tumba la publicación: ya está hecha.
      - name: Podar releases viejas de draw101
        if: steps.cargar.outputs.cargado == 'si'
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.TOKEN_DESCARGAS }}
          GUARDAR: ${{ env.GUARDAR_VERSIONES }}
        run: |
          set -euo pipefail
          python - <<'EOF'
          import json, os, re, urllib.request

          TOKEN = os.environ["TOKEN"]
          GUARDAR = int(os.environ.get("GUARDAR", "3"))
          REPO = "mikebalcazar/descargas"

          def api(ruta, metodo="GET"):
              pedido = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}{ruta}", method=metodo,
                  headers={"Authorization": f"Bearer {TOKEN}",
                           "Accept": "application/vnd.github+json",
                           "User-Agent": "draw101-podar"})
              with urllib.request.urlopen(pedido, timeout=60) as r:
                  return json.loads(r.read() or b"null") if r.status != 204 else None

          def numero(tag):
              return tuple(int(x) for x in re.findall(r"\d+", tag))

          releases = api("/releases?per_page=100") or []
          mias = [r for r in releases
                  if r["tag_name"].startswith("draw101-") and r["tag_name"] != "draw101-ultima"]
          mias.sort(key=lambda r: numero(r["tag_name"]), reverse=True)
          quedan, sobran = mias[:GUARDAR], mias[GUARDAR:]
          print("se quedan:", [r["tag_name"] for r in quedan])
          if not sobran:
              print("no hay nada que podar")
              raise SystemExit(0)
          for r in sobran:
              tag = r["tag_name"]
              api(f"/releases/{r['id']}", "DELETE")
              try:
                  api(f"/git/refs/tags/{tag}", "DELETE")
              except Exception as exc:          # la etiqueta pudo no existir ya
                  print(f"  (la etiqueta {tag} no se pudo borrar: {exc})")
              mb = sum(a["size"] for a in r["assets"]) / 1e6
              print(f"borrada {tag} ({mb:.0f} MB)")
          libres = sum(sum(a["size"] for a in r["assets"]) for r in sobran) / 1e9
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(f"- Podadas {len(sobran)} releases viejas de draw101 ({libres:.2f} GB).\n")
          EOF
